<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(160, 201, 201);
            text-align: center;
        }

        a {
            text-decoration: none;
            color: black;
            margin-bottom: 50px;
        }

        #Game {
            width: 60%;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            transition: .3s;
        }

        button:hover {
            transform: translateY(-10px);
        }

        .btnGame {
            width: 200px;
            height: 80px;
            border-radius: 10px;
            border: none;
            font-size: 20px;
            margin: 20px;
        }

        @media screen and (max-width: 767px) {
            .btnGame {
                height: 70px;
                margin: 0px;
            }
        }
    </style>
</head>

<body>
    <h1>Мини игры</h1>
    <h3 id="GameH3">Выберите игру:</h3>
    <div id="Game">
        <button class="btnGame" style="background-color: rgb(204, 176, 231);" id="Easy"><a href="random.html">Угадай
                число</a></button>
        <button class="btnGame" style="background-color: rgb(125, 141, 230);" id="Normal"><a
                href="visilica.html">Виселица</a></button>
        <button class="btnGame" style="background-color: rgb(245, 146, 171);" id="Hard"><a
                href="math.html">Математика</a></button>
        <button class="btnGame" style="background-color: #9be79b;" id="Hard"><a href="index.html">Скоро</a></button>
    </div>

    <script src="script/visilica.js"></script>
</body>

</html>
